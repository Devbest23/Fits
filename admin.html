<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>FITS - Admin CMS</title>
    <link rel="icon" type="image/png" href="img/fits%20two.png" />
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link href="css/styles.css?v=2" rel="stylesheet" />
    <link
      href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap"
      rel="stylesheet"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;600;700&family=Hanken+Grotesk:wght@400;500;600&family=JetBrains+Mono:wght@500&display=swap"
      rel="stylesheet"
    />
    <style>
      .admin-table th, .admin-table td {
        background-color: transparent;
        color: var(--on-surface);
        border-color: var(--outline-variant);
        vertical-align: middle;
      }
      .admin-table th {
        font-family: 'Space Grotesk', sans-serif;
        text-transform: uppercase;
        font-size: 0.85rem;
        letter-spacing: 1px;
        color: var(--on-surface-variant);
      }
      .form-control, .form-select {
        background-color: var(--surface);
        border: 1px solid var(--outline-variant);
        color: var(--on-surface);
      }
      .form-control:focus, .form-select:focus {
        background-color: var(--surface);
        border-color: var(--primary);
        color: var(--on-surface);
        box-shadow: 0 0 0 0.25rem rgba(175, 255, 69, 0.25);
      }
      .form-label {
        font-family: 'JetBrains Mono', monospace;
        font-size: 0.8rem;
        text-transform: uppercase;
        color: var(--on-surface-variant);
      }
    </style>
  </head>
  <body class="bg-background text-on-background d-flex flex-column min-vh-100">
    <!-- ===== NAVBAR ===== -->
    <nav class="navbar navbar-expand-md sticky-top bg-surface-glass border-bottom border-outline-variant shadow-sm">
      <div class="container-lg d-flex justify-content-between align-items-center">
        <a class="navbar-brand d-flex align-items-center" href="index.html">
          <img src="img/fits%20two.png?v=2" alt="FITS" height="46" />
        </a>
        <div class="d-flex align-items-center gap-3">
          <span class="badge bg-primary text-background label-caps">Modo Administrador</span>
          <a href="index.html" class="nav-link text-on-surface-variant">Volver a la Tienda</a>
        </div>
      </div>
    </nav>

    <!-- ===== MAIN ===== -->
    <main class="flex-grow-1 py-5">
      <div class="container-lg">
        <div class="d-flex justify-content-between align-items-end border-bottom technical-border pb-3 mb-4">
          <h1 class="font-headline text-primary fw-bold mb-0 section-heading">GESTIÓN DE PRODUCTOS</h1>
          <div class="d-flex gap-2">
            <button class="btn btn-outline-danger label-caps d-inline-flex align-items-center gap-2" id="btnClearDB">
              <span class="material-symbols-outlined" style="font-size: 18px">delete_forever</span>
              VACIAR BD
            </button>
            <button class="btn btn-primary technical-shadow label-caps d-inline-flex align-items-center gap-2" data-bs-toggle="modal" data-bs-target="#productModal" id="btnNewProduct">
              <span class="material-symbols-outlined" style="font-size: 18px">add</span>
              NUEVO PRODUCTO
            </button>
          </div>
        </div>

        <div class="table-responsive glass-panel border border-outline-variant p-3">
          <table class="table admin-table mb-0">
            <thead>
              <tr>
                <th>Imagen</th>
                <th>Nombre</th>
                <th>Categoría</th>
                <th>Precio</th>
                <th>Oferta</th>
                <th>Etiqueta</th>
                <th class="text-end">Acciones</th>
              </tr>
            </thead>
            <tbody id="adminProductsTable">
              <!-- Rendered via JS -->
            </tbody>
          </table>
        </div>
      </div>
    </main>

    <!-- Modal for Add/Edit -->
    <div class="modal fade" id="productModal" tabindex="-1" aria-labelledby="productModalLabel" aria-hidden="true">
      <div class="modal-dialog modal-dialog-centered">
        <div class="modal-content bg-surface border-outline-variant text-on-surface">
          <div class="modal-header border-outline-variant">
            <h5 class="modal-title font-headline text-primary" id="productModalLabel">Añadir Producto</h5>
            <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal" aria-label="Close"></button>
          </div>
          <div class="modal-body">
            <form id="productForm">
              <input type="hidden" id="prodId">
              
              <div class="mb-3">
                <label for="prodName" class="form-label">Nombre del Producto</label>
                <input type="text" class="form-control" id="prodName" required>
              </div>
              
              <div class="mb-3">
                <label for="prodCategory" class="form-label">Categoría</label>
                <div class="input-group">
                  <select class="form-select" id="prodCategory">
                    <!-- Categories injected via JS -->
                  </select>
                  <input type="text" class="form-control" id="prodNewCategory" placeholder="O escribe nueva">
                </div>
              </div>

              <div class="row">
                <div class="col-md-6 mb-3">
                  <label for="prodPrice" class="form-label">Precio Normal ($)</label>
                  <input type="number" class="form-control" id="prodPrice" step="0.01" required>
                </div>
                <div class="col-md-6 mb-3">
                  <label for="prodSalePrice" class="form-label">Precio Oferta ($)</label>
                  <input type="number" class="form-control" id="prodSalePrice" step="0.01" placeholder="Opcional">
                </div>
              </div>

              <div class="mb-3">
                <label class="form-label">Imagen del Producto</label>
                <input type="file" class="form-control" id="prodImageFile" accept="image/*">
                <small class="text-on-surface-variant d-block mt-1">Sube una imagen o deja vacío si el producto ya tiene.</small>
                <input type="hidden" id="prodImage">
              </div>

              <div class="mb-3">
                <label for="prodTag" class="form-label">Etiqueta (Opcional)</label>
                <select class="form-select" id="prodTag">
                  <option value="">Ninguna</option>
                  <option value="NEW">NEW</option>
                  <option value="SALE">SALE</option>
                </select>
              </div>

              <div class="mb-3">
                <label class="form-label">Mostrar en:</label>
                <div class="form-check">
                  <input class="form-check-input" type="checkbox" id="showProducts" checked>
                  <label class="form-check-label" for="showProducts">Sección "Productos"</label>
                </div>
                <div class="form-check">
                  <input class="form-check-input" type="checkbox" id="showOffers">
                  <label class="form-check-label" for="showOffers">Sección "Ofertas"</label>
                </div>
                <div class="form-check">
                  <input class="form-check-input" type="checkbox" id="showWholesale">
                  <label class="form-check-label" for="showWholesale">Sección "Al Mayor"</label>
                </div>
                <div class="form-check">
                  <input class="form-check-input" type="checkbox" id="showRecommended">
                  <label class="form-check-label" for="showRecommended">Sección "Recomendados" (Carrito)</label>
                </div>
              </div>
            </form>
          </div>
          <div class="modal-footer border-outline-variant">
            <button type="button" class="btn btn-outline-secondary label-caps" data-bs-dismiss="modal">Cancelar</button>
            <button type="button" class="btn btn-primary technical-shadow label-caps" id="btnSaveProduct">Guardar Producto</button>
          </div>
        </div>
      </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/db.js"></script>
    <script src="js/admin.js"></script>
  </body>
</html>
